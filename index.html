    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: var(--app-viewport-height, 100%);
            min-height: 100%;
            background: #05070b;
            color: #f7ead2;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body.app-boot-hidden #app,
        body.app-boot-hidden #modal-container,
        body.app-boot-hidden #toast-container {
            display: none !important;
        }

        /* ===== 启动健康忠告 splash ===== */
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 100000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #boot-splash.is-hiding {
            opacity: 0;
        }
        #boot-splash-inner {
            text-align: center;
            color: rgba(255, 246, 224, 0.86);
            font-size: 14px;
            line-height: 2;
            letter-spacing: 0.04em;
            user-select: none;
        }
        #boot-splash-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.32em;
            color: rgba(246, 201, 107, 0.78);
            margin-bottom: 18px;
            text-shadow: 0 0 8px rgba(246, 201, 107, 0.28);
        }
        @media (max-width: 360px) {
            #boot-splash-inner { font-size: 12px; line-height: 1.9; }
        }
    </style>

        <div id="boot-splash-inner">
            <div id="boot-splash-title">健康游戏忠告</div>
            <div>抵制不良游戏，拒绝盗版游戏。</div>
            <div>注意自我保护，谨防受骗上当。</div>
            <div>适度游戏益脑，沉迷游戏伤身。</div>
            <div>合理安排时间，享受健康生活。</div>
        </div>
    </div>
    <script>
        (function() {
            // 启动忠告显示 1.8 秒后渐隐，0.5 秒动画完成后移除节点
            window.addEventListener('load', function() {
                setTimeout(function() {
                    var splash = document.getElementById('boot-splash');
                    if (!splash) return;
                    splash.classList.add('is-hiding');
                    setTimeout(function() {
                        if (splash && splash.parentNode) {
                            splash.parentNode.removeChild(splash);
                        }
                    }, 520);
                }, 1800);
            });
        })();
    </script>
